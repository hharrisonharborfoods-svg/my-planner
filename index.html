<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Planner</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f2f7;
      --surface:   #ffffff;
      --border:    #e2e6ef;
      --text:      #1e2130;
      --muted:     #7b849a;
      --accent:    #4f6ef7;
      --accent-lt: #eef0ff;
      --danger:    #e05050;
      --green:     #22c55e;
      --col-todo:       #7b849a;
      --col-thisweek:   #f59e0b;
      --col-inprogress: #4f6ef7;
      --col-review:     #a855f7;
      --col-done:       #22c55e;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,.12);
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      border: none; background: none; cursor: pointer;
      padding: 8px 16px; font-size: .875rem; font-weight: 600;
      color: var(--muted); border-radius: 8px;
      transition: all .15s;
    }
    .tab-btn:hover { background: var(--bg); color: var(--text); }
    .tab-btn.active { background: var(--accent-lt); color: var(--accent); }

    /* ── Header right ── */
    .header-right { display: flex; align-items: center; gap: 8px; }
    .today-badge {
      font-size: .75rem; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px; white-space: nowrap;
    }
    .btn { border: none; border-radius: 8px; padding: 7px 14px; font-size: .825rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3a57e8; }
    .btn-secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { transform: scale(.97); }

    /* ── Tab panels ── */
    .tab-panel { display: none; flex: 1; }
    .tab-panel.active { display: flex; flex-direction: column; }

    /* ══════════════════════════════════════════
       KANBAN
    ══════════════════════════════════════════ */
    .filter-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 28px 0; flex-wrap: wrap;
    }
    .filter-bar label { font-size: .75rem; color: var(--muted); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .filter-chip {
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 20px; padding: 4px 12px; font-size: .78rem;
      cursor: pointer; transition: all .15s; font-weight: 500;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .board-wrap { flex: 1; overflow-x: auto; padding: 16px 28px 40px; }
    .board { display: flex; gap: 14px; min-width: max-content; align-items: flex-start; }

    .column {
      width: 265px; background: var(--surface);
      border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
      max-height: calc(100vh - 155px);
    }
    .col-header {
      padding: 12px 14px 10px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 2px solid var(--border);
      position: relative;
    }
    .col-header::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; border-radius: var(--radius) var(--radius) 0 0;
    }
    .col-todo       .col-header::before { background: var(--col-todo); }
    .col-thisweek   .col-header::before { background: var(--col-thisweek); }
    .col-inprogress .col-header::before { background: var(--col-inprogress); }
    .col-review     .col-header::before { background: var(--col-review); }
    .col-done       .col-header::before { background: var(--col-done); }

    .col-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: .875rem; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; }
    .col-todo       .col-dot { background: var(--col-todo); }
    .col-thisweek   .col-dot { background: var(--col-thisweek); }
    .col-inprogress .col-dot { background: var(--col-inprogress); }
    .col-review     .col-dot { background: var(--col-review); }
    .col-done       .col-dot { background: var(--col-done); }

    .col-count {
      font-size: .72rem; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 1px 7px; color: var(--muted); font-weight: 600;
    }
    .col-add-btn {
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: 1rem; padding: 2px 5px; border-radius: 4px; transition: all .15s;
    }
    .col-add-btn:hover { color: var(--accent); background: var(--accent-lt); }

    .col-cards {
      flex: 1; overflow-y: auto; padding: 8px; display: flex;
      flex-direction: column; gap: 7px; min-height: 60px;
    }
    .col-cards::-webkit-scrollbar { width: 3px; }
    .col-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .drop-zone { min-height: 60px; border-radius: 8px; transition: background .15s, border .15s; }
    .drop-zone.drag-over { background: var(--accent-lt); border: 2px dashed var(--accent); }

    /* ── Card ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; cursor: grab;
      box-shadow: var(--shadow-sm); transition: box-shadow .15s, transform .15s, opacity .15s;
      user-select: none;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .card.dragging { opacity: .35; cursor: grabbing; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
    .card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .card-tag { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 4px; padding: 2px 6px; }
    .tag-work     { background: #dbeafe; color: #1d4ed8; }
    .tag-personal { background: #fce7f3; color: #9d174d; }
    .tag-high     { background: #fee2e2; color: #b91c1c; }
    .tag-medium   { background: #fef3c7; color: #92400e; }
    .tag-low      { background: #dcfce7; color: #166534; }

    .card-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .card:hover .card-actions { opacity: 1; }
    .card-btn { background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 4px; font-size: .8rem; color: var(--muted); transition: all .12s; }
    .card-btn:hover { color: var(--text); background: var(--bg); }
    .card-btn.del:hover { color: var(--danger); background: #fee2e2; }

    .card-title { font-size: .875rem; font-weight: 600; line-height: 1.4; margin-bottom: 5px; word-break: break-word; }
    .card-desc  { font-size: .78rem; color: var(--muted); line-height: 1.5; margin-bottom: 7px; word-break: break-word; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .card-due { font-size: .72rem; color: var(--muted); display: flex; align-items: center; gap: 3px; }
    .card-due.overdue { color: var(--danger); font-weight: 600; }
    .card-due.today   { color: #f59e0b; font-weight: 600; }
    .card-move {
      font-size: .68rem; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px;
      cursor: pointer; transition: all .12s; white-space: nowrap;
    }
    .card-move:hover { border-color: var(--accent); color: var(--accent); }

    .empty-state { text-align: center; color: var(--muted); font-size: .78rem; padding: 18px 8px; pointer-events: none; }
    .empty-state .es-icon { font-size: 1.5rem; margin-bottom: 5px; }

    /* ══════════════════════════════════════════
       CALENDAR
    ══════════════════════════════════════════ */
    .cal-wrap { flex: 1; padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 16px; }

    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 20px;
      box-shadow: var(--shadow-sm);
    }
    .cal-nav-title { font-size: 1.15rem; font-weight: 700; }
    .cal-nav-btns { display: flex; gap: 6px; }
    .cal-nav-btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 14px; font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: all .15s;
    }
    .cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cal-today-btn {
      background: var(--accent-lt); border: 1px solid var(--accent);
      color: var(--accent); border-radius: 7px; padding: 6px 14px;
      font-size: .85rem; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .cal-today-btn:hover { background: var(--accent); color: #fff; }

    .cal-legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .leg-item { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--muted); font-weight: 500; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

    .calendar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
      overflow: hidden; flex: 1;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

    .cal-dow {
      padding: 10px 6px; text-align: center; font-size: .72rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .cal-day {
      min-height: 110px; border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border); padding: 6px;
      position: relative; vertical-align: top;
      transition: background .12s;
    }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day.other-month { background: #fafbfc; }
    .cal-day.other-month .cal-day-num { color: #c5cad8; }
    .cal-day.today-day { background: #fffbeb; }
    .cal-day.today-day .cal-day-num {
      background: var(--accent); color: #fff;
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    .cal-day-num {
      font-size: .78rem; font-weight: 600; color: var(--muted);
      margin-bottom: 4px; display: inline-block;
      width: 24px; text-align: center;
    }

    .cal-day-add {
      position: absolute; top: 5px; right: 5px;
      background: none; border: none; cursor: pointer;
      color: var(--border); font-size: .95rem; line-height: 1;
      border-radius: 4px; padding: 1px 3px;
      transition: all .12s; opacity: 0;
    }
    .cal-day:hover .cal-day-add { opacity: 1; color: var(--accent); }

    .cal-event {
      font-size: .72rem; font-weight: 600;
      border-radius: 4px; padding: 2px 6px;
      margin-bottom: 3px; cursor: pointer;
      line-height: 1.4; word-break: break-word;
      display: flex; align-items: center; justify-content: space-between;
      gap: 3px; transition: opacity .12s;
    }
    .cal-event:hover { opacity: .85; }
    .cal-event .ev-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-event .ev-done-btn {
      background: none; border: none; cursor: pointer;
      font-size: .75rem; flex-shrink: 0; opacity: .7;
      padding: 0 1px; transition: opacity .12s;
    }
    .cal-event .ev-done-btn:hover { opacity: 1; }

    .ev-work     { background: #dbeafe; color: #1d4ed8; }
    .ev-personal { background: #fce7f3; color: #9d174d; }
    .ev-high     { background: #fee2e2; color: #b91c1c; }
    .ev-done-ev  { background: #dcfce7; color: #166534; text-decoration: line-through; opacity: .7; }

    /* ── More events ── */
    .cal-more { font-size: .7rem; color: var(--accent); cursor: pointer; font-weight: 600; padding: 1px 4px; }
    .cal-more:hover { text-decoration: underline; }

    /* ══════════════════════════════════════════
       MODAL
    ══════════════════════════════════════════ */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
      align-items: center; justify-content: center;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 14px;
      width: 480px; max-width: 95vw;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      padding: 26px; animation: slideUp .2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 8px 11px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .875rem; font-family: inherit;
      color: var(--text); background: var(--bg); transition: border-color .15s; outline: none;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); background: #fff; }
    .form-row textarea { resize: vertical; min-height: 72px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancel { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: .85rem; cursor: pointer; font-weight: 600; }
    .btn-cancel:hover { background: var(--border); }
    .btn-save { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: #3a57e8; }

    /* ── Day detail popup ── */
    .day-popup {
      display: none; position: fixed; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-md); padding: 16px;
      width: 280px; z-index: 150; animation: slideUp .15s ease;
    }
    .day-popup.open { display: block; }
    .day-popup h3 { font-size: .9rem; font-weight: 700; margin-bottom: 10px; }
    .day-popup-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .day-popup-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-radius: 6px; gap: 6px;
      border: 1px solid var(--border); font-size: .8rem;
    }
    .day-popup-item .dpi-title { flex: 1; font-weight: 600; }
    .day-popup-item .dpi-col { font-size: .7rem; color: var(--muted); }
    .dpi-btns { display: flex; gap: 3px; }
    .dpi-btn { background: none; border: none; cursor: pointer; font-size: .8rem; padding: 2px 4px; border-radius: 4px; }
    .dpi-btn:hover { background: var(--bg); }
    .day-popup-footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .popup-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: .8rem; }
    .popup-close:hover { color: var(--text); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-left">
    <h1>🗂️ My Planner</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="kanban">📋 Kanban</button>
      <button class="tab-btn" data-tab="calendar">📅 Calendar</button>
    </div>
  </div>
  <div class="header-right">
    <span class="today-badge" id="todayBadge"></span>
    <button class="btn btn-secondary" onclick="exportData()" title="Export backup">💾 Export</button>
    <button class="btn btn-primary" onclick="openModal()">＋ Add Task</button>
  </div>
</header>

<!-- ── Setup Banner (hidden once configured) ── -->
<div id="setupBanner" style="display:none; background:#fef3c7; border-bottom:1px solid #fcd34d; padding:10px 28px; font-size:.85rem; color:#92400e; text-align:center;">
  ⚠️ Cloud sync not configured yet — your tasks are saved locally only.
  <a href="https://supabase.com/dashboard" target="_blank" style="color:#1d4ed8; font-weight:600;">Set up Supabase</a> to sync across devices.
</div>

<!-- ══════════════════════════════════════════
     KANBAN PANEL
══════════════════════════════════════════ -->
<div class="tab-panel active" id="panel-kanban">
  <div class="filter-bar">
    <label>Filter:</label>
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="work">💼 Work</button>
    <button class="filter-chip" data-filter="personal">🏠 Personal</button>
    <button class="filter-chip" data-filter="high">🔴 High Priority</button>
    <button class="filter-chip" data-filter="due-today">📅 Due Today</button>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     CALENDAR PANEL
══════════════════════════════════════════ -->
<div class="tab-panel" id="panel-calendar">
  <div class="cal-wrap">

    <div class="cal-nav">
      <div>
        <div class="cal-nav-title" id="calMonthTitle"></div>
        <div class="cal-legend" id="calLegend" style="margin-top:4px"></div>
      </div>
      <div class="cal-nav-btns">
        <button class="cal-nav-btn" onclick="calShift(-1)">‹ Prev</button>
        <button class="cal-today-btn" onclick="calToday()">Today</button>
        <button class="cal-nav-btn" onclick="calShift(1)">Next ›</button>
      </div>
    </div>

    <div class="calendar">
      <div class="cal-grid" id="calDows"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

  </div>
</div>

<!-- ── Day popup ── -->
<div class="day-popup" id="dayPopup">
  <h3 id="dayPopupTitle"></h3>
  <div class="day-popup-list" id="dayPopupList"></div>
  <div class="day-popup-footer">
    <button class="btn btn-primary" style="font-size:.78rem;padding:5px 10px" id="dayPopupAdd">＋ Add</button>
    <button class="popup-close" onclick="closePopup()">✕ Close</button>
  </div>
</div>

<!-- ── Task Modal ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add New Task</h2>
    <div class="form-row">
      <label>Task Title *</label>
      <input type="text" id="fTitle" placeholder="What needs to be done?" />
    </div>
    <div class="form-row">
      <label>Description</label>
      <textarea id="fDesc" placeholder="Optional notes…"></textarea>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Category</label>
        <select id="fCat">
          <option value="work">💼 Work</option>
          <option value="personal">🏠 Personal</option>
        </select>
      </div>
      <div class="form-row">
        <label>Priority</label>
        <select id="fPri">
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Due Date</label>
        <input type="date" id="fDue" />
      </div>
      <div class="form-row">
        <label>Column</label>
        <select id="fCol">
          <option value="todo">To Do</option>
          <option value="thisweek">This Week</option>
          <option value="inprogress">In Progress</option>
          <option value="review">Review</option>
          <option value="done">Done</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="btnSave" onclick="saveCard()">Add Task</button>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────
   SUPABASE CONFIG — paste your values here

/* Cloud load / save with localStorage fallback */
async function load() {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    // Not configured yet — use localStorage
    try { cards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { cards = []; }
    return;
  }
  try {
    const { data, error } = await sb.from('board_data').select('cards').eq('id', BOARD_ID).single();
    if (error && error.code === 'PGRST116') {
      // Row doesn't exist yet — create it
      await sb.from('board_data').insert({ id: BOARD_ID, cards: [] });
      cards = [];
    } else if (error) {
      throw error;
    } else {
      const cloudCards = data.cards || [];
      // Don't overwrite local data with empty cloud data
      let localCards = [];
      try { localCards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch {}
      if (cloudCards.length === 0 && localCards.length > 0) {
        cards = localCards;
        // Push local data to cloud
        await sb.from('board_data').upsert({ id: BOARD_ID, cards: localCards, updated_at: new Date().toISOString() });
      } else {
        cards = cloudCards;
      }
    }
    cloudReady = true;
    // Also keep a local backup
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  } catch (err) {
    console.warn('Cloud load failed, using local backup:', err);
    try { cards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { cards = []; }
  }
}

async function save() {
  // Always save locally as backup
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));

  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') return; // not configured
  try {
    const { error } = await sb.from('board_data').upsert({
      id: BOARD_ID,
      cards: cards,
      updated_at: new Date().toISOString()
    });
    if (error) {
      console.error('Cloud save error:', error);
      showSyncError('Save failed — changes saved locally only.');
    }
  } catch (err) {
    console.error('Cloud save failed:', err);
    showSyncError('Save failed — changes saved locally only.');
  }
}

/* Show a visible warning if sync fails */
function showSyncError(msg) {
  let banner = document.getElementById('syncError');
  if (!banner) {
    banner = document.createElement('div');

    banner.style.cssText = 'background:#fee2e2;border-bottom:1px solid #fca5a5;padding:10px 28px;font-size:.85rem;color:#b91c1c;text-align:center;cursor:pointer;';
    banner.title = 'Click to dismiss';
    banner.onclick = () => banner.remove();
    document.body.insertBefore(banner, document.body.children[1]);
  }
  banner.textContent = '⚠️ ' + msg;
}

/* Real-time sync: when another device changes data, update here */
function startRealtimeSync() {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
  sb.channel('board-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'board_data', filter: `id=eq.${BOARD_ID}` }, payload => {
      if (payload.new && payload.new.cards) {
        cards = payload.new.cards;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
        renderAll();
      }
    })
    .subscribe();
}

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(s) {
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function formatDue(due) {
  if (!due) return null;
  const t = todayStr();
  if (due === t)  return { label:'📅 Today', cls:'today' };
  if (due < t)    return { label:'⚠️ '+fmtDate(due), cls:'overdue' };
  return { label:'📅 '+fmtDate(due), cls:'' };
}

function makeCardEl(card, colId) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.id = card.id;
  const due = formatDue(card.due);
  const next = NEXT_COL[colId];
  el.innerHTML = `
    <div class="card-top">
      <div class="card-tags">
        <span class="card-tag tag-${card.cat}">${card.cat==='work'?'💼 Work':'🏠 Personal'}</span>
        <span class="card-tag tag-${card.priority}">${card.priority.charAt(0).toUpperCase()+card.priority.slice(1)}</span>
      </div>
      <div class="card-actions">
        <button class="card-btn" onclick="editCard('${card.id}')">✏️</button>
        <button class="card-btn del" onclick="deleteCard('${card.id}')">🗑️</button>
      </div>
    </div>
    <div class="card-title">${esc(card.title)}</div>
    ${card.desc ? `<div class="card-desc">${esc(card.desc)}</div>` : ''}
    <div class="card-footer">
      ${due ? `<span class="card-due ${due.cls}">${due.label}</span>` : '<span></span>'}
      ${next ? `<button class="card-move" onclick="moveCard('${card.id}','${next}')">→ ${NEXT_LABEL[colId]}</button>` : '<span></span>'}
    </div>
  `;
  el.addEventListener('dragstart', e => {
    draggedId = card.id;
    setTimeout(() => el.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    draggedId = null;
    document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
  });
  return el;
}

function setupDrop(zone) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    if (!draggedId) return;
    const c = cards.find(x => x.id === draggedId);
    if (c) { c.col = zone.dataset.col; save(); renderAll(); }
  });
}

/* ─────────────────────────────────────────────
   CALENDAR STATE
───────────────────────────────────────────── */
let calYear, calMonth;
const DAYS_OF_WEEK = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function calInit() {
  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth();
}
function calShift(dir) { calMonth += dir; if (calMonth > 11) { calMonth = 0; calYear++; } if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function calToday()    { const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); renderCalendar(); }

/* ─────────────────────────────────────────────
   CALENDAR RENDER
───────────────────────────────────────────── */
function renderCalendar() {
  document.getElementById('calMonthTitle').textContent = `${MONTHS[calMonth]} ${calYear}`;

  // Day-of-week headers
  const dows = document.getElementById('calDows');
  dows.innerHTML = '';
  DAYS_OF_WEEK.forEach(d => { const el = document.createElement('div'); el.className='cal-dow'; el.textContent=d; dows.appendChild(el); });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const today = todayStr();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev  = new Date(calYear, calMonth, 0).getDate();

  // Build map: dateStr -> cards[]
  const byDate = {};
  cards.forEach(c => { if (c.due) { (byDate[c.due] = byDate[c.due] || []).push(c); } });

  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    let day, dateStr, isOther = false;
    if (i < firstDay) {
      day = daysInPrev - firstDay + i + 1;
      const m = calMonth === 0 ? 12 : calMonth;
      const y = calMonth === 0 ? calYear - 1 : calYear;
      dateStr = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      isOther = true;
    } else if (i >= firstDay + daysInMonth) {
      day = i - firstDay - daysInMonth + 1;
      const m = calMonth === 11 ? 1 : calMonth + 2;
      const y = calMonth === 11 ? calYear + 1 : calYear;
      dateStr = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      isOther = true;
    } else {
      day = i - firstDay + 1;
      dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    const cell = document.createElement('div');
    cell.className = 'cal-day' + (isOther ? ' other-month' : '') + (dateStr === today ? ' today-day' : '');
    cell.dataset.date = dateStr;

    const numEl = document.createElement('div');
    numEl.className = 'cal-day-num';
    if (dateStr === today) {
      numEl.style.cssText = 'background:var(--accent);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;';
    }
    numEl.textContent = day;
    cell.appendChild(numEl);

    const addBtn = document.createElement('button');
    addBtn.className = 'cal-day-add';
    addBtn.textContent = '＋';
    addBtn.title = 'Add task on this day';
    addBtn.onclick = e => { e.stopPropagation(); openModal(null, dateStr); };
    cell.appendChild(addBtn);

    const dayCards = byDate[dateStr] || [];
    const MAX_SHOW = 3;
    dayCards.slice(0, MAX_SHOW).forEach(c => {
      const ev = makeEventEl(c);
      cell.appendChild(ev);
    });
    if (dayCards.length > MAX_SHOW) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = `+${dayCards.length - MAX_SHOW} more`;
      more.onclick = e => { e.stopPropagation(); openDayPopup(dateStr, dayCards, e); };
      cell.appendChild(more);
    }

    if (dayCards.length > 0) {
      cell.addEventListener('click', e => {
        if (e.target === cell || e.target === numEl) openDayPopup(dateStr, dayCards, e);
      });
    }

    grid.appendChild(cell);
  }

  renderLegend();
}

function makeEventEl(card) {
  const ev = document.createElement('div');
  const isDone = card.col === 'done';
  let cls = isDone ? 'ev-done-ev' : (card.priority === 'high' ? 'ev-high' : (card.cat === 'work' ? 'ev-work' : 'ev-personal'));
  ev.className = `cal-event ${cls}`;
  ev.title = card.title + (card.desc ? '\n' + card.desc : '');
  ev.innerHTML = `
    <span class="ev-title">${esc(card.title)}</span>
    ${!isDone ? `<button class="ev-done-btn" title="Mark Done" onclick="markDone('${card.id}',event)">✓</button>` : '<span style="font-size:.7rem">✓</span>'}
  `;
  ev.addEventListener('click', e => { if (!e.target.classList.contains('ev-done-btn')) editCard(card.id); });
  return ev;
}

function renderLegend() {
  const leg = document.getElementById('calLegend');
  leg.innerHTML = `
    <span class="leg-item"><span class="leg-dot" style="background:#93c5fd"></span>Work</span>
    <span class="leg-item"><span class="leg-dot" style="background:#f9a8d4"></span>Personal</span>
    <span class="leg-item"><span class="leg-dot" style="background:#fca5a5"></span>High Priority</span>

  `;
}

let popupDate = null;

function openDayPopup(dateStr, dayCards, evt) {
  closePopup();
  popupDate = dateStr;
  const popup = document.getElementById('dayPopup');
  document.getElementById('dayPopupTitle').textContent = fmtDateFull(dateStr);
  const list = document.getElementById('dayPopupList');
  list.innerHTML = '';
  dayCards.forEach(c => {
    const item = document.createElement('div');
    item.className = 'day-popup-item';
    const isDone = c.col === 'done';
    item.innerHTML = `
      <span class="dpi-title" style="${isDone?'text-decoration:line-through;opacity:.6':''}">${esc(c.title)}</span>
      <span class="dpi-col">${COL_LABELS[c.col]}</span>
      <div class="dpi-btns">
        ${!isDone ? `<button class="dpi-btn" title="Mark Done" onclick="markDone('${c.id}',event,true)">✅</button>` : ''}
        <button class="dpi-btn" title="Edit" onclick="editCard('${c.id}');closePopup()">✏️</button>
      </div>
    `;
    list.appendChild(item);
  });
  document.getElementById('dayPopupAdd').onclick = () => { closePopup(); openModal(null, dateStr); };

  // Position near click
  const x = Math.min(evt.clientX + 10, window.innerWidth - 300);
  const y = Math.min(evt.clientY + 10, window.innerHeight - 260);
  popup.style.left = x + 'px';
  popup.style.top  = y + 'px';
  popup.classList.add('open');

  setTimeout(() => document.addEventListener('click', popupClickAway), 0);
}

function popupClickAway(e) {
  const popup = document.getElementById('dayPopup');
  if (!popup.contains(e.target)) { closePopup(); }
}

function closePopup() {
  document.getElementById('dayPopup').classList.remove('open');
  document.removeEventListener('click', popupClickAway);
  popupDate = null;
}

function fmtDateFull(s) {
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

function markDone(id, evt, fromPopup) {
  if (evt) evt.stopPropagation();
  const c = cards.find(x => x.id === id);
  if (c) { c.col = 'done'; save(); renderAll(); if (fromPopup) closePopup(); }
}

function openModal(presetCol, presetDate) {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add New Task';
  document.getElementById('btnSave').textContent = 'Add Task';
  document.getElementById('fTitle').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fCat').value = 'work';
  document.getElementById('fPri').value = 'medium';
  document.getElementById('fDue').value = presetDate || '';
  document.getElementById('fCol').value = presetCol || 'todo';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 80);
}

function editCard(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Task';
  document.getElementById('btnSave').textContent = 'Save Changes';
  document.getElementById('fTitle').value = c.title;
  document.getElementById('fDesc').value = c.desc || '';
  document.getElementById('fCat').value = c.cat;
  document.getElementById('fPri').value = c.priority;
  document.getElementById('fDue').value = c.due || '';
  document.getElementById('fCol').value = c.col;
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 80);
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

function saveCard() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { document.getElementById('fTitle').focus(); return; }
  const data = {
    title,
    desc:     document.getElementById('fDesc').value.trim(),
    cat:      document.getElementById('fCat').value,
    priority: document.getElementById('fPri').value,
    due:      document.getElementById('fDue').value,
    col:      document.getElementById('fCol').value,
  };
  if (editingId) {
    const idx = cards.findIndex(c => c.id === editingId);
    if (idx !== -1) cards[idx] = { ...cards[idx], ...data };
  } else {
    cards.push({ id: uid(), createdAt: Date.now(), ...data });
  }
  save(); renderAll(); closeModal();
}

function deleteCard(id) {
  if (!confirm('Delete this task?')) return;
  cards = cards.filter(c => c.id !== id);
  save(); renderAll();
}

function moveCard(id, targetCol) {
  const c = cards.find(x => x.id === id);
  if (c) { c.col = targetCol; save(); renderAll(); }
}
